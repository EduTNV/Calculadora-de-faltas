<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Calculadora de faltas do 6º Semestre - Controle suas presenças e veja quantas faltas ainda pode dar em cada matéria.">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Controle de Faltas - 6º Semestre</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <div class="header-nav" id="header-calendar-nav">
            <div class="month-year-display">
                <button onclick="prevWeek()" id="btn-prev-week" aria-label="Semana anterior">&lt;</button>
                <div class="week-info" onclick="toggleDatePicker()">
                    <span id="month-year-text">AGO 2026</span>
                    <span id="week-range-text">semana 24-28</span>
                </div>
                <button onclick="nextWeek()" id="btn-next-week" aria-label="Próxima semana">&gt;</button>
            </div>
            <button id="btn-today" onclick="goToToday()">Hoje</button>
        </div>
        <div class="header-title" id="header-summary-title" style="display: none;">
            <img src="grafico-histograma.png" class="header-icon" alt="Resumo"> Resumo de Faltas
        </div>
    </header>

    <main id="tab-calendar" class="tab-content active">
        <div class="date-carousel" id="date-carousel"></div>
        <div id="calendar-container"></div>
    </main>

    <main id="tab-summary" class="tab-content">
        <div class="summary-header">
            <p>Faltas do Semestre - 6º Semestre 2026</p>
        </div>
        <div id="summary-container"></div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('calendar')" id="nav-calendar">
            <img src="3917244.png" class="nav-icon-img" alt="Calendário">
            <span>Calendário</span>
        </div>
        <div class="nav-item" onclick="switchTab('summary')" id="nav-summary">
            <img src="grafico-histograma.png" class="nav-icon-img" alt="Resumo">
            <span>Resumo</span>
        </div>
    </nav>

    <div id="date-picker-overlay" onclick="toggleDatePicker()">
        <div id="date-picker" onclick="event.stopPropagation()">
            <div class="picker-month-nav">
                <button onclick="prevMonthPicker()" aria-label="Mês anterior">&lt;</button>
                <h3 id="date-picker-month-year">MÊS ANO</h3>
                <button onclick="nextMonthPicker()" aria-label="Próximo mês">&gt;</button>
            </div>
            
            <div class="calendar-grid" id="date-picker-grid"></div>
            <button id="close-date-picker" onclick="toggleDatePicker()">Fechar</button>
        </div>
    </div>

</body>
</html>
