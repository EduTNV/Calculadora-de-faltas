<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Faltas - Medicina 2026</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <div class="header-nav" id="header-calendar-nav">
            <div class="month-year-display">
                <button onclick="prevWeek()" id="btn-prev-week">&lt;</button>
                <div class="week-info" onclick="toggleDatePicker()">
                    <span id="month-year-text">MARÇO 2026</span>
                    <span id="week-range-text">semana 23-28</span>
                </div>
                <button onclick="nextWeek()" id="btn-next-week">&gt;</button>
            </div>
            <button id="btn-today" onclick="goToToday()">exibir hoje</button>
        </div>
        <div class="header-title" id="header-summary-title" style="display: none;">Resumo</div>
    </header>

    <main id="tab-calendar" class="tab-content active">
        <div class="date-carousel" id="date-carousel"></div>
        <div id="calendar-container"></div>
    </main>

    <main id="tab-summary" class="tab-content">
        <div class="summary-header">
            <p>Faltas do Semestre (Jan - Jul 2026)</p>
        </div>
        <div id="summary-container"></div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('calendar')">
            <span class="nav-icon">📅</span>
            <span>Calendário</span>
        </div>
        <div class="nav-item" onclick="switchTab('summary')">
            <span class="nav-icon">📊</span>
            <span>Resumo</span>
        </div>
    </nav>

    <div id="date-picker-overlay" onclick="toggleDatePicker()">
        <div id="date-picker" onclick="event.stopPropagation()">
            <div class="picker-month-nav">
                <button onclick="prevMonthPicker()">&lt;</button>
                <h3 id="date-picker-month-year">MÊS ANO</h3>
                <button onclick="nextMonthPicker()">&gt;</button>
            </div>
            
            <div class="calendar-grid" id="date-picker-grid"></div>
            <button id="close-date-picker" onclick="toggleDatePicker()">Fechar</button>
        </div>
    </div>

</body>
</html>
